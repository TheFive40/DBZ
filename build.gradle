plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("io.papermc.paperweight.userdev") version "1.7.1" // 👈 Agrega esto

}

group = 'org.delawarex'
version = '1.0.1'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { // 👈 Agrega esto
        name = "minecraftforge"
        url = "https://maven.minecraftforge.net/"
    }
}

dependencies {
    // 👇 Reemplaza el compileOnly de paper-api por esto
    paperweight.paperDevBundle("1.20.1-R0.1-SNAPSHOT")
    compileOnly 'com.github.DragonMineZ:dragonminez:2.0.3-beta'
    compileOnly 'net.minecraftforge:forge:1.20.1-47.2.0:universal'

}

tasks {
    // 👇 Cambia de jar a reobfJar para que funcione en el servidor
    assemble {
        dependsOn reobfJar
    }

    runServer {
        minecraftVersion("1.20")
    }
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}